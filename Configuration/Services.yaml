services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  SpecialistaWeb\RssNewsImport\:
    resource: '../Classes/*'
    exclude:
      # Value objects and classes instantiated manually (not services)
      - '../Classes/Domain/Dto/*'
      - '../Classes/Http/LimitedStream.php'
      - '../Classes/Http/HttpClientException.php'
      - '../Classes/Http/SimplePieHttpClient.php'
      - '../Classes/Feed/KeywordFilter.php'

  SpecialistaWeb\RssNewsImport\Command\ImportFeedsCommand:
    public: true
